  .small{font-size:1.9cqw;color:var(--lgray)}
  .key{font-family:'Press Start 2P',monospace;font-size:0.85cqw;color:var(--lav)}

  if(!win) scene.hp=Math.max(0,scene.hp-1);
  const q=H.cur.q, maxc=Math.max(1,...H.cur.counts), pct= total? Math.round(correctVotes/total*100):0;
  const verdict = manualK!==undefined ? (win?'<span class="grn">¡CORRECTO! ¡GOLPE AL MONSTRUO!</span>':'<span class="red">¡INCORRECTO! EL MONSTRUO ATACA</span>')
    : total===0 ? '<span class="red">NADIE RESPONDIÓ: EL MONSTRUO ATACA</span>'
    : win ? `<span class="grn">¡LA MAYORÍA ACERTÓ! ${correctVotes}/${total} (${pct}%)</span>` : `<span class="red">SOLO ${correctVotes}/${total} ACERTARON (${pct}%): EL MONSTRUO ATACA</span>`;
  panel.querySelectorAll('.opt').forEach((b,k)=>{ b.disabled=true;
    if(k===ci) b.classList.add('right'); else b.classList.add('dim');
    if(manualK===undefined){ const c=H.cur.counts[k]; b.insertAdjacentHTML('afterbegin',`<span class="bar" style="width:${c/maxc*100}%"></span>`); document.getElementById('ct'+k).textContent=c; } });
  panel.querySelector('.qtext').outerHTML=`<div class="row"><div class="verdict">${verdict}</div><span style="flex:1"></span><button class="big" data-act="next">CONTINUAR ▶</button></div>`;
  panel.querySelector('.timer')?.remove(); panel.querySelector('.row .key')?.parentElement.remove();
  panel.insertAdjacentHTML('beforeend',`<div class="exp" style="color:var(--lgray)"><span class="yel">✔</span> ${esc(q.e)}</div>`);
  renderHUD(); sync();
}
function next(){
  const L=LEVELS[scene.level];
  if(H.hearts<=0) return showOver();
  H.qi++;
  if(H.qi>=L.q.length){
    scene.monAlive=false; scene.monFade=1; SFX.win(); H.phase='levelEnd';
    for(let i=0;i<30;i++) scene.fx.push({x:240,y:55,vx:(rr()-.5)*160,vy:(rr()-.7)*140,c:['#ffec27','#fff1e8','#ff77a8'][i%3],life:1,g:150});
    H.cur=null; const lastL=scene.level>=LEVELS.length-1;
    panel.innerHTML=`<div class="h1">¡${L.mname} DERROTADO!</div>${topList(3)}
      <div class="row push"><button class="big" data-act="${lastL?'victory':'nextLevel'}">SIGUIENTE ▶</button><span class="key">ENTER</span></div>`;
    renderHUD(); sync(); return;
  }
  showQuestion();
}
function topList(n){
  const ids=Object.keys(H.scores).sort((a,b)=>H.scores[b]-H.scores[a]).slice(0,n); if(!ids.length) return '<div class="exp">¡Bien hecho, clase!</div>';
  return `<div class="lb">${ids.map((p,i)=>`<span class="n">${['1º','2º','3º','4º','5º'][i]}</span><span><img src="${avatarURL(H.avs[p])}" alt="">${esc(H.nicks[p]||'???')}</span><span class="yel">${H.scores[p]}</span>`).join('')}</div>`;
}
function showOver(){ H.phase='over'; scene.mode='over'; H.cur=null; clearTimer(); SFX.over();
  panel.innerHTML=`<div class="h1" style="color:var(--red)">GAME OVER</div><div class="exp">La clase se quedó sin corazones en ${LEVELS[scene.level].name}. ¡A repasar y reintentar!</div>${topList(3)}
    <div class="row push">${Object.keys(H.scores).length?'<button class="big" data-act="board">VER TABLA ▶</button>':''}<button class="big alt" data-act="start">REINTENTAR</button><button class="big alt" data-act="title">MENÚ</button></div>`;
  renderHUD(); sync(); }
function showVictory(){ H.phase='end'; scene.mode='victory'; scene.fx=[]; H.cur=null; SFX.win();
  panel.innerHTML=`<div class="row"><div class="h1">¡CASO RESUELTO!</div><span class="exp">La clase acertó ${H.classCorrect} de ${TOTALQ} rondas.</span></div>
    ${Object.keys(H.scores).length?topList(3)+'<div class="row push"><button class="big" data-act="board">VER TABLA DE PUNTUACIONES ▶</button><span class="key">ENTER</span></div>':'<div class="row push"><button class="big" data-act="start">JUGAR DE NUEVO ▶</button><button class="big alt" data-act="title">MENÚ</button></div>'}`;
  renderHUD(); sync(); }

function showBoard(){
  setBoard(true); SFX.win();
  const ids=Object.keys(H.scores).sort((a,b)=>H.scores[b]-H.scores[a] || (H.hits[b]||0)-(H.hits[a]||0));
  const pod=(i,cls)=>{ const p=ids[i]; if(!p) return `<div class="pod ${cls}" style="visibility:hidden"><div class="blk"></div></div>`;
    return `<div class="pod ${cls}"><img src="${avatarURL(H.avs[p])}" alt=""><div class="nm">${esc(H.nicks[p]||'???')}</div><div class="pt">${H.scores[p]} pts</div><div class="ac">${H.hits[p]||0} ${(H.hits[p]||0)===1?'acierto':'aciertos'}</div><div class="blk">${i+1}º</div></div>`; };
  const rest=ids.slice(3,27);
  panel.innerHTML=`<div class="btitle">TABLA DE PUNTUACIONES</div>
    <div class="podium">${pod(1,'p2')}${pod(0,'p1')}${pod(2,'p3')}</div>
    <div class="rest">${rest.map((p,k)=>`<div><span class="r">${k+4}º</span><img src="${avatarURL(H.avs[p])}" alt=""><span class="nm">${esc(H.nicks[p]||'???')}</span><span class="pt">${H.scores[p]}</span></div>`).join('')}</div>
    <div class="row push"><button class="big" data-act="start">JUGAR DE NUEVO ▶</button><button class="big alt" data-act="title">MENÚ</button><span class="key">${ids.length} jugadores${ids.length>27?' · se muestran los 27 primeros':''} · ${TOTALQ} preguntas</span></div>`;
  renderHUD();
}
// ---- host input ----
panel.addEventListener('click',e=>{ const o=e.target.closest('button[data-opt]'); if(o&&H.manual&&H.phase==='question'){ ac(); reveal(+o.dataset.opt); return; }
  const b=e.target.closest('[data-act]'); if(!b) return; ac(); act(b.dataset.act); });
function act(a){ switch(a){
  case 'lim20': H.limit=20; SFX.click(); showTitle(); break; case 'lim30': H.limit=30; SFX.click(); showTitle(); break; case 'lim0': H.limit=0; SFX.click(); showTitle(); break;
  case 'start': startGame(); break; case 'title': SFX.click(); showTitle(); break; case 'fight': SFX.click(); showQuestion(); break;
  case 'next': SFX.click(); next(); break; case 'board': showBoard(); break; case 'nextLevel': scene.level++; showIntro(); break; case 'victory': showVictory(); break; } }
document.addEventListener('keydown',e=>{ if(IS_PLAYER) return; const k=e.key.toLowerCase();
  if(k==='f'){toggleFS();return;} if(k==='m'){toggleSound();return;} if(k==='r'&&H.phase==='title'&&!room&&!H.connecting){location.reload();return;}
  if(H.phase==='question'){ if(H.manual){ const i='1234'.indexOf(k)>=0?'1234'.indexOf(k):'abcd'.indexOf(k); if(i>=0&&k.length===1){reveal(i);return;} }
    else if(k==='enter'){ e.preventDefault(); reveal(); return; } }
  if((k==='enter'||k===' ') && document.getElementById('game').classList.contains('board')) return;
  if(k==='enter'||k===' '){ e.preventDefault(); const b=panel.querySelector('[data-act="start"],[data-act="fight"],[data-act="next"],[data-act="nextLevel"],[data-act="victory"],[data-act="board"]'); if(b){ac();act(b.dataset.act);} } });
const sndBtn=document.getElementById('sndBtn'), fsBtn=document.getElementById('fsBtn');
function toggleSound(){ soundOn=!soundOn; sndBtn.textContent=soundOn?'♪ ON':'♪ OFF'; if(soundOn){ac();startMusic();} }
sndBtn.addEventListener('click',toggleSound);
function toggleFS(){ const el=document.getElementById('game'); try{ if(!document.fullscreenElement){const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el); if(p&&p.catch)p.catch(()=>{});} else {const p=document.exitFullscreen(); if(p&&p.catch)p.catch(()=>{});} }catch(e){} }
fsBtn.addEventListener('click',toggleFS);

// ===================== PLAYER (phone) =====================
const P={ nick:'', av:(()=>{try{const v=parseInt(localStorage.getItem('csilab_av'));return v>=0&&v<8?v:Math.floor(Math.random()*8);}catch(e){return Math.floor(Math.random()*8);}})(), joined:false, st:null, myAns:{}, myPeer:null };
const pl=document.getElementById('player');
function loadNick(){ try{ return localStorage.getItem('csilab_nick')||''; }catch(e){ return ''; } }
function saveNick(n){ try{ localStorage.setItem('csilab_nick',n); }catch(e){} }
function enterPlayer(){ IS_PLAYER=true; document.body.className='player'; renderPlayer(); }
function myPeer(){ if(!room) return null; try{ const me=room.peers().find(p=>p.sameTab); return me?me.peer:null; }catch(e){ return null; } }
function renderPlayer(){
  const s=P.st;
  const key=[P.joined,!!room,P.err,s&&s.ph,s&&s.qid,s&&s.lv,s&&s.n,s&&P.myAns[s.qid],s&&s.pts?JSON.stringify(s.pts[P.myPeer||'']||''):''].join('|');
  if(key===P.lastKey) return; P.lastKey=key;
  if(!P.joined){
    pl.innerHTML=`<div class="ptitle">CSI LAB<br>MODO CLASE</div>
      <div class="pcard">Escribe tu apodo y elige tu gatito.</div>
      <input id="nick" maxlength="14" placeholder="Tu apodo" value="${esc((document.getElementById('nick')||{}).value||P.nick||loadNick())}">
      <div class="avgrid">${KCOL.map((_,i)=>`<button class="avb ${i===P.av?'sel':''}" data-av="${i}"><img src="${avatarURL(i)}" alt="gatito ${i+1}"></button>`).join('')}</div>
      <button class="pbtn" id="joinBtn">UNIRME ▶</button>
      <div class="pcard" id="pstatus" style="font-size:20px">${room?'<span class="ok">Conectado a la sala '+esc(SALA.toUpperCase())+'.</span>':P.err?'<span class="bad">No se pudo conectar.</span> Prueba con datos móviles u otro wifi y toca reintentar.':'Conectando a la sala '+esc(SALA.toUpperCase())+'...'}</div>${(!room&&P.err)?'<button class="pbtn" onclick="location.reload()">REINTENTAR ↻</button>':''}`;
    pl.querySelectorAll('.avb').forEach(b=>b.onclick=()=>{ P.av=+b.dataset.av; try{localStorage.setItem('csilab_av',P.av);}catch(e){} pl.querySelectorAll('.avb').forEach(x=>x.classList.toggle('sel',x===b)); });
    document.getElementById('joinBtn').onclick=()=>{ const n=document.getElementById('nick').value.trim().replace(/[^\p{L}\p{N} _.-]/gu,'').slice(0,14);
      if(!n) return; P.nick=n; saveNick(n); P.joined=true; pushPresence(); renderPlayer(); };
    return;
  }
  if(!room){ pl.innerHTML=`<div class="ptitle">SIN CONEXIÓN</div><div class="pcard">${P.err==='lib'?'No se pudo cargar el juego completo. Revisa tu internet.':'No se pudo conectar a la sala. Prueba con datos móviles o con otro wifi.'}</div><button class="pbtn" onclick="location.reload()">REINTENTAR ↻</button>`; return; }
  const head=`<div class="pmeta"><span class="phead"><img src="${avatarURL(P.av)}" alt="">${esc(P.nick)}</span><span>${s&&s.n&&s.ph!=='end'&&s.ph!=='over'?('PREGUNTA '+Math.min(s.n,s.tot)+'/'+s.tot):''}</span></div>`;
  if(!s || s.ph==='title' || s.ph==='intro' || s.ph==='levelEnd'){
    const lv= s && s.lv!=null && s.ph!=='title' ? `<div class="pbig yel">${esc(LEVELS[s.lv]?LEVELS[s.lv].name:'')}</div>`:'';
    pl.innerHTML=`${head}<img class="myav" src="${avatarURL(P.av)}" alt=""><div class="ptitle">¡LISTO, ${esc(P.nick)}!</div>${lv}<div class="pcard">Mira la pantalla del salón. La pregunta aparecerá aquí.</div>`; return; }
  if(s.ph==='question'){
    const mine=P.myAns[s.qid];
    if(mine!==undefined){ pl.innerHTML=`${head}<div class="pcard pq">${esc(s.q)}</div><div class="pcard"><span class="pbig ok">RESPUESTA ENVIADA ${SHAPES[mine]}</span><br><br>Espera a que todos respondan...</div>`; return; }
    pl.innerHTML=`${head}<div class="pcard pq">${esc(s.q)}</div>
      <div class="pgrid">${s.o.map((t,k)=>`<button class="pans k${k}" data-k="${k}"><span class="sh">${SHAPES[k]}</span><span>${esc(t)}</span></button>`).join('')}</div>`;
    pl.querySelectorAll('.pans').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; P.myAns[s.qid]=k; pushPresence({qid:s.qid,k}); if(navigator.vibrate) try{navigator.vibrate(40);}catch(e){} renderPlayer(); });
    return; }
  if(s.ph==='reveal'){
    const mine=P.myAns[s.qid]; const me=P.myPeer||myPeer(); const pts=s.pts&&me&&s.pts[me];
    const ok = mine!==undefined && mine===s.c;
    const res = mine===undefined ? '<span class="pbig bad">NO RESPONDISTE</span>' : ok ? '<span class="pbig ok">¡CORRECTO!</span>' : '<span class="pbig bad">INCORRECTO</span>';
    pl.innerHTML=`${head}<div class="pcard">${res}<br><br>Respuesta: <span class="yel">${SHAPES[s.c]} ${esc(s.o[s.c])}</span></div>
      <div class="pcard">${pts?`+${pts[1]} puntos<br>Total: <span class="yel">${pts[0]}</span><br>Puesto: <span class="yel">${pts[2]}º</span>`:'Mira la pantalla del salón.'}</div>`; return; }
  if(s.ph==='end'||s.ph==='over'){
    const me=P.myPeer||myPeer(); const pts=s.pts&&me&&s.pts[me];
    pl.innerHTML=`${head}<div class="ptitle">${s.ph==='end'?'¡CASO RESUELTO!':'GAME OVER'}</div>
      <img class="myav" src="${avatarURL(P.av)}" alt=""><div class="pcard">${pts?`Tus puntos: <span class="yel">${pts[0]}</span><br>Aciertos: <span class="yel">${pts[3]||0}</span><br>Tu puesto: <span class="yel">${pts[2]}º</span>${pts[2]<=3?'<br><br><span class="pbig ok">¡ESTÁS EN EL PODIO!</span>':''}`:'¡Gracias por jugar!'}</div>`; return; }
}
function pushPresence(ans){ if(!room||!P.joined) return; const patch={role:'p',nick:P.nick,av:P.av}; if(ans) patch.ans=ans; room.presence(patch).catch(()=>{}); }

// ===================== BOOT =====================
let lastEpochSeen=null;
function onState(msg){
  if(!IS_PLAYER) return; const d=msg.data; if(!d||typeof d!=='object') return;
  if(typeof d.ph!=='string') return;
  P.st=d; if(!P.myPeer) P.myPeer=myPeer(); if(P.joined) renderPlayer();
}
// ---------- Relay transport (MQTT over secure WebSocket; works on most networks) ----------
function waitLib(){ return new Promise(r=>{ let n=0; (function chk(){ if(window.mqtt&&window.mqtt.connect) return r(true); if(++n>80) return r(false); setTimeout(chk,100); })(); }); }
function tryBroker(url, opts, ms){
  return new Promise(resolve=>{
    let c; try{ c=window.mqtt.connect(url,{connectTimeout:ms,reconnectPeriod:2000,keepalive:20,clean:true,...opts}); }catch(e){ return resolve(null); }
    let done=false; const t=setTimeout(()=>{ if(!done){ done=true; try{c.end(true);}catch(e){} resolve(null);} }, ms+500);
    c.once('connect',()=>{ if(!done){ done=true; clearTimeout(t); resolve(c);} });
  });
}
const TOP = code => 'csilab-v2/'+code;
async function makeHostRoom(){
  if(!(await waitLib())) return null;
  let client=null, bi=0;
  for(bi=0; bi<BROKERS.length && !client; bi++) client = await tryBroker(BROKERS[bi], {clientId:'h'+HOST_CODE+Math.random().toString(36).slice(2,6)}, 6000);
  if(!client) return null;
  bi--; JOIN_URL = BASE_URL + '?sala=' + HOST_CODE + '&b=' + bi + '#jugar';
  const base=TOP(HOST_CODE), pres={}, seen={}, peerL=[];
  const fire=(ch)=>{ const ps=api.peers(); peerL.forEach(f=>{try{f({peers:ps,joined:[],left:[],updated:[],...ch});}catch(e){}}); };
  const api={
    peers:()=>[{peer:'host',sameTab:true,isMe:true,presence:{}}, ...Object.keys(pres).map(id=>({peer:id,sameTab:false,isMe:false,presence:pres[id]}))],
    emit:async(topic,data)=>{ try{ client.publish(base+'/'+topic, JSON.stringify(data), {qos:0, retain:true}); }catch(e){} },
    on:()=>()=>{}, onPeers:(f)=>{ peerL.push(f); return ()=>{}; }, presence:async()=>{}, connected:()=>client.connected
  };
  const sub=()=>client.subscribe(base+'/p/+',{qos:0});
  sub(); client.on('connect',sub);
  client.on('message',(topic,payload)=>{
    const id=topic.split('/').pop(); if(!/^[a-z0-9]{4,24}$/.test(id)) return;
    let txt=''; try{ txt=new TextDecoder().decode(payload); }catch(e){}
    if(!txt){ if(id in pres){ delete pres[id]; delete seen[id]; fire({left:[{peer:id}]}); } return; }
    let p; try{ p=JSON.parse(txt); }catch(e){ return; } if(!p||typeof p!=='object'||p.role!=='p') return;
    const isNew=!(id in pres); pres[id]=p; seen[id]=Date.now();
    const me=api.peers().find(x=>x.peer===id); fire(isNew?{joined:[me]}:{updated:[me]});
  });
  setInterval(()=>{ const now=Date.now(); for(const id of Object.keys(seen)){ if(now-seen[id]>30000){ delete pres[id]; delete seen[id]; fire({left:[{peer:id}]}); } } },5000);
  return api;
}
async function makePlayerRoom(){
  if(!SALA) return null;
  if(!(await waitLib())) { P.err='lib'; return null; }
  const myId='p'+Math.random().toString(36).slice(2,10);
  const base=TOP(SALA), me=base+'/p/'+myId;
  const client = await tryBroker(BROKERS[BIDX], {clientId:myId, will:{topic:me, payload:'', qos:0, retain:false}}, 10000);
  if(!client){ P.err='net'; return null; }
  let my={}; const topicL={};
  const send=()=>{ if(my.role) try{ client.publish(me, JSON.stringify(my), {qos:0}); }catch(e){} };
  const api={
    peers:()=>[{peer:myId,sameTab:true,isMe:true,presence:my}],
    emit:async()=>{}, on:(t,f)=>{ (topicL[t]=topicL[t]||[]).push(f); return ()=>{}; }, onPeers:()=>()=>{},
    presence:async(patch)=>{ my={...my,...patch}; send(); }, connected:()=>client.connected
  };
  const sub=()=>{ client.subscribe(base+'/state',{qos:0}); send(); };
  sub(); client.on('connect',sub);
  client.on('message',(topic,payload)=>{ if(topic!==base+'/state') return; let d; try{ d=JSON.parse(new TextDecoder().decode(payload)); }catch(e){ return; }
    (topicL.state||[]).forEach(f=>{ try{ f({topic:'state',data:d,peer:'host'}); }catch(e){} }); });
  setInterval(send, 10000);
  window.addEventListener('pagehide',()=>{ try{ client.publish(me,'',{qos:0}); client.end(); }catch(e){} });
  return api;
}
async function boot(){
  H.connecting=true;
  if(IS_PLAYER) enterPlayer(); else showTitle();
  room = IS_PLAYER ? await makePlayerRoom() : await makeHostRoom();
  H.connecting=false;
  if(!room){ if(IS_PLAYER) renderPlayer(); else showTitle(); return; }
  room.on('state', onState, ()=>{});
  room.onPeers(ch=>{
    if(IS_PLAYER) return;
    if(ch.joined.length && H.phase!=='title') sync();
    if(H.phase==='title'){ renderChips(); if(ch.joined.length) SFX.join(); }
    renderHUD();
  }, ()=>{});
  if(IS_PLAYER){ P.myPeer=myPeer(); renderPlayer(); if(P.joined) pushPresence(); }
  else showTitle();
}
boot();
</script>
